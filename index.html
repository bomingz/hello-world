<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Hello, world.</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20201e; background: #f7f7f5; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 42rem); }
    p { margin: 0 0 1.25rem; color: #777772; font-size: .78rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.5rem, 12vw, 7.5rem); font-weight: 550; letter-spacing: -.075em; line-height: .95; }
    .mark { display: inline-block; width: .16em; height: .16em; margin-left: .12em; border-radius: 50%; background: #6d7b68; vertical-align: .08em; }
    footer { margin-top: 2.5rem; color: #777772; font-size: .9rem; }
    @media (prefers-reduced-motion: no-preference) { .mark { animation: breathe 2.8s ease-in-out infinite; } @keyframes breathe { 50% { opacity: .45; transform: scale(.82); } } }
  </style>
</head>
<body>
  <main>
    <p>A small beginning</p>
    <h1>Hello, world<span class="mark" aria-hidden="true"></span></h1>
    <footer>Glad you’re here.</footer>
  </main>
</body>
</html>
